<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rides</title>
  <meta name="description" content="Your own rideshare history as stats and a map. Runs entirely in your browser.">
  <meta name="theme-color" content="#07090e">
  <!-- Privacy: only this site's own files may load, plus two pinned exceptions for the optional basemap:
       the MapLibre 4.7.1 script and stylesheet (unpkg, exact-version path) and the OpenFreeMap style,
       tiles, glyphs and sprites. No ride data is ever sent. See README "Privacy model" and DECISIONS.md. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com/maplibre-gl@4.7.1/; style-src 'self' 'unsafe-inline' https://unpkg.com/maplibre-gl@4.7.1/; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="./public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/ui/styles.css">
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px">Rides needs JavaScript to read your export. Nothing is uploaded.</p></noscript>
  <script type="module" src="./src/ui/main.js"></script>
</body>
</html>
