name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (UTC)
        run: TZ=UTC npm test
      - name: Unit tests (Asia/Tokyo, to catch local-time assumptions)
        run: TZ=Asia/Tokyo npm test
      - name: Type check (JSDoc)
        run: npx -y -p typescript@5.9.3 tsc -p jsconfig.json
      - name: Sample data is reproducible
        run: npm run sample && git diff --exit-code data/sample-trips.csv
      - name: Build
        run: npm run build
